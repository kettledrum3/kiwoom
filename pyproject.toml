[project]
name = "kiwoom"
version = "0.1.0"
description = "CostAvg and Value Rebal"
authors = [
    {name = "kettledrum",email = "kettledrum@naver.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit (>=1.55.0)",
    "pandas (>=2.2.0,<3.0.0)",
    "plotly (>=6.6.0,<7.0.0)",
    "requests (>=2.33.0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "apscheduler (>=3.11.2,<4.0.0)",
    "pytz (>=2026.1.post1,<2027.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "urllib3 (>=2.0.0)",
    "tabulate (>=0.9.0)",
    "websockets (>=12.0)",
    "pycryptodome (>=3.20.0)",
    "matplotlib (>=3.8.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

